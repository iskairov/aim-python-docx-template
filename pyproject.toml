[project]
name = "docxtpl"
dynamic = ["version"]
description = "Шаблонизатор документов Microsoft Word (.docx) на базе Python и Jinja2"
authors = [{name = "Eric Lapouyade", email = "elapouya@proton.me"}]
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "LGPL-2.1-only"}
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["jinja2", "docx", "word", "template", "openxml"]
dependencies = [
    "python-docx>=1.1.1",
    "jinja2",
    "lxml",
]

[project.optional-dependencies]
subdoc = ["docxcompose"]
docs = ["Sphinx", "sphinxcontrib-napoleon"]

[dependency-groups]
dev = [
    "mypy >=1.18.2; python_version >= '3.9'",
    "lxml-stubs >=0.5.1; python_version >= '3.9'",
    "flake8 >=7.3.0; python_version >= '3.9'"
]

[project.urls]
homepage = "https://github.com/elapouya/python-docx-template"
repository = "https://github.com/elapouya/python-docx-template.git"
documentation = "https://docxtpl.readthedocs.io/en/latest/"

[tool.mypy]
pretty = true
python_version = "3.9"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["docs", "build", "setup.py"]

[[tool.mypy.overrides]]
module = ["docxcompose.*"]
ignore_missing_imports = true

[tool.pdm]
version = {source = "file", path = "docxtpl/__init__.py"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
